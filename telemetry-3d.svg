<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%">
  <defs>
    <radialGradient id="isoBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#220505" />
      <stop offset="100%" stop-color="#0d1117" />
    </radialGradient>
    <linearGradient id="towerTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FF2800" />
    </linearGradient>
    <linearGradient id="towerLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC0000" />
      <stop offset="100%" stop-color="#590000" />
    </linearGradient>
    <linearGradient id="towerRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a0000" />
      <stop offset="100%" stop-color="#2b0000" />
    </linearGradient>
    <filter id="glow3d" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="320" rx="10" fill="url(#isoBg)" stroke="#DC0000" stroke-width="1.2" stroke-opacity="0.65" />

  
  <text x="28" y="30" fill="#FF2800" font-family="&#39;Orbitron&#39;, monospace" font-size="11.5" font-weight="bold" letter-spacing="3">
    🏎️ 3D ISOMETRIC COMMIT SKYLINE &amp; LIVE CIRCUIT TELEMETRY
  </text>
  <text x="872" y="30" text-anchor="end" fill="#FFB800" font-family="monospace" font-size="11">
    SECTOR 1: 26.4s • SECTOR 2: 27.1s • SECTOR 3: 25.8s
  </text>
  <line x1="25" y1="42" x2="875" y2="42" stroke="#2a0a0a" stroke-width="1" />

  
  <g transform="translate(225, 225)">
    
    <polygon points="0,-95 175,0 0,95 -175,0" fill="#11151c" stroke="#DC0000" stroke-width="1" stroke-opacity="0.5" />
    <line x1="-87" y1="-47" x2="87" y2="47" stroke="#FF2800" stroke-opacity="0.2" />
    <line x1="87" y1="-47" x2="-87" y2="47" stroke="#FF2800" stroke-opacity="0.2" />

    
    <g transform="translate(0, -35)">
      <polygon points="0,-68 22,-56 0,-44 -22,-56" fill="url(#towerTop)" />
      <polygon points="-22,-56 0,-44 0,12 -22,0" fill="url(#towerLeft)" />
      <polygon points="22,-56 0,-44 0,12 22,0" fill="url(#towerRight)" />
      <animateTransform attributeName="transform" type="translate" values="0,-35; 0,-46; 0,-35" dur="2.8s" repeatCount="indefinite" />
    </g>

    
    <g transform="translate(-55, -5)">
      <polygon points="0,-52 22,-40 0,-28 -22,-40" fill="url(#towerTop)" />
      <polygon points="-22,-40 0,-28 0,15 -22,3" fill="url(#towerLeft)" />
      <polygon points="22,-40 0,-28 0,15 22,3" fill="url(#towerRight)" />
      <animateTransform attributeName="transform" type="translate" values="-55,-5; -55,-15; -55,-5" dur="3.3s" repeatCount="indefinite" />
    </g>

    
    <g transform="translate(55, -5)">
      <polygon points="0,-58 22,-46 0,-34 -22,-46" fill="url(#towerTop)" />
      <polygon points="-22,-46 0,-34 0,15 -22,3" fill="url(#towerLeft)" />
      <polygon points="22,-46 0,-34 0,15 22,3" fill="url(#towerRight)" />
      <animateTransform attributeName="transform" type="translate" values="55,-5; 55,-18; 55,-5" dur="2.5s" repeatCount="indefinite" />
    </g>

    
    <g transform="translate(0, 28)">
      <polygon points="0,-46 22,-34 0,-22 -22,-34" fill="url(#towerTop)" />
      <polygon points="-22,-34 0,-22 0,18 -22,6" fill="url(#towerLeft)" />
      <polygon points="22,-34 0,-22 0,18 22,6" fill="url(#towerRight)" />
      <animateTransform attributeName="transform" type="translate" values="0,28; 0,18; 0,28" dur="3.1s" repeatCount="indefinite" />
    </g>

    
    <g transform="translate(-105, 12)">
      <polygon points="0,-32 18,-22 0,-12 -18,-22" fill="#FF2800" />
      <polygon points="-18,-22 0,-12 0,10 -18,0" fill="#800000" />
      <polygon points="18,-22 0,-12 0,10 18,0" fill="#450000" />
    </g>
    <g transform="translate(105, 12)">
      <polygon points="0,-36 18,-26 0,-16 -18,-26" fill="#FFB800" />
      <polygon points="-18,-26 0,-16 0,10 -18,0" fill="#990000" />
      <polygon points="18,-26 0,-16 0,10 18,0" fill="#450000" />
    </g>
  </g>
  <text x="225" y="295" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="11">
    [ 3D CONTRIBUTION MATRIX • PEAK VELOCITY ]
  </text>

  
  <line x1="450" y1="55" x2="450" y2="295" stroke="#2a0a0a" stroke-width="1.5" />

  
  <g transform="translate(470, 55)">
    <rect x="0" y="0" width="405" height="215" rx="8" fill="#11151c" stroke="#2a0a0a" stroke-width="1" />

    
    <path d="M 65 155 C 35 155, 35 95, 85 80 L 185 50 C 235 35, 295 35, 345 60 C 380 78, 375 125, 330 140 L 255 158 C 215 168, 195 130, 155 135 C 120 140, 105 155, 65 155 Z" fill="none" stroke="#3d0000" stroke-width="16" stroke-linecap="round" transform="translate(0, 8)" />

    
    <path id="monzaTrack" d="M 65 155 C 35 155, 35 95, 85 80 L 185 50 C 235 35, 295 35, 345 60 C 380 78, 375 125, 330 140 L 255 158 C 215 168, 195 130, 155 135 C 120 140, 105 155, 65 155 Z" fill="none" stroke="#1f242d" stroke-width="14" stroke-linecap="round" />

    
    <path d="M 65 155 C 35 155, 35 95, 85 80 L 185 50 C 235 35, 295 35, 345 60 C 380 78, 375 125, 330 140 L 255 158 C 215 168, 195 130, 155 135 C 120 140, 105 155, 65 155 Z" fill="none" stroke="#FF2800" stroke-width="2" stroke-dasharray="10 8" />

    
    <circle cx="85" cy="80" r="4" fill="#FFB800" />
    <text x="65" y="68" fill="#FFB800" font-family="monospace" font-size="9">S1: AI/ML</text>

    <circle cx="345" cy="60" r="4" fill="#00FF66" />
    <text x="315" y="45" fill="#00FF66" font-family="monospace" font-size="9">S2: DRS</text>

    <circle cx="255" cy="158" r="4" fill="#FF2800" />
    <text x="245" y="182" fill="#FF2800" font-family="monospace" font-size="9">S3: DEPLOY</text>

    
    <g filter="url(#glow3d)">
      <circle r="7" fill="#FF2800" opacity="0.45">
        <animate attributeName="r" values="6;11;6" dur="0.8s" repeatCount="indefinite" />
      </circle>
      <circle r="4.5" fill="#FFB800" stroke="#ffffff" stroke-width="1" />
      <animateMotion dur="4.5s" repeatCount="indefinite" rotate="auto">
        <mpath href="#monzaTrack" />
      </animateMotion>
    </g>

    
    <text x="16" y="24" fill="#c9d1d9" font-family="monospace" font-size="10.5" font-weight="bold">GPS LIVE TRACKER // CAR #07</text>
    <text x="16" y="198" fill="#00FF66" font-family="monospace" font-size="10">SPEED: 348 KM/H  |  GEAR: 8  |  ERS: 98%</text>
  </g>
  <text x="672" y="295" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="11">
    [ LIVE 3D CIRCUIT GPS &amp; SECTOR TELEMETRY ]
  </text>
</svg>